name: LeetCode Tracker

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  track-leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This gives write access
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run LeetCode tracker
      env:
        SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        LEET_USER: ${{ secrets.LEET_USER }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
      run: python leetcode_tracker.py
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add last_submissions.json
        git diff --staged --quiet || git commit -m "Update last submissions data"
        git push
